name: Regenerate pnpm lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    if: github.head_ref == 'chore/regenerate-pnpm-lockfile-20261008'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/regenerate-pnpm-lockfile-20261008
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile"
          git push origin chore/regenerate-pnpm-lockfile-20261008
