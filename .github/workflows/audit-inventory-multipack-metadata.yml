name: Audit inventory multipack metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inventory multipack metadata audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only audit
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/audit-inventory-multipack-metadata.ts | tee inventory-multipack-metadata-audit.jsonl

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-multipack-metadata-audit
          path: inventory-multipack-metadata-audit.jsonl
          if-no-files-found: ignore
          retention-days: 14
