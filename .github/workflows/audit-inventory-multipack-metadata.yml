name: Audit inventory multipack metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Inventory multipack metadata audit
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only audit
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/audit-inventory-multipack-metadata.ts | tee inventory-multipack-metadata-audit.jsonl

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-multipack-metadata-audit
          path: inventory-multipack-metadata-audit.jsonl
          if-no-files-found: ignore
          retention-days: 14
