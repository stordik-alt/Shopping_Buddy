name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PWA checks and a paired PWA/Android visual smoke run. A change that only touches the Expo app skips
# web-only build and database jobs, but still runs the visual smoke job. The mobile app has its own
# typecheck/export workflow (mobile.yml). Nothing here deploys: production is the manual cloudflare-deploy.yml.
jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Web checks run unless every changed file is inside apps/mobile. Anything shared (root, packages/shared,
      # lockfile, workflows, docs) still runs them, as does a push to main or a manual run.
      - name: Compare changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          web=true
          mobile=false
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            others=$(printf '%s\n' "$changed" | grep -v '^apps/mobile/' || true)
            mobile_files=$(printf '%s\n' "$changed" | grep '^apps/mobile/' || true)
            if [ -z "$others" ]; then web=false; fi
            if [ -n "$mobile_files" ]; then mobile=true; fi
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests, typecheck and production build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm exec vitest run --exclude 'app/actions/**/*.test.ts' --exclude 'app/api/**/*.test.ts' --exclude 'lib/db/queries.test.ts' --exclude 'lib/db/receipt-list.test.ts' --exclude 'lib/db/store-branch-search.test.ts' --exclude 'lib/db/deals.test.ts' --exclude 'lib/db/purchase-items.test.ts' --exclude 'lib/db/category-changes.test.ts' --exclude 'lib/db/subcategory-changes.test.ts' --exclude 'lib/db/product-classification-sync.test.ts' --exclude 'lib/db/product-packages.test.ts' --exclude 'lib/db/new-subcategories.test.ts' --exclude 'lib/db/recategorize.test.ts' --exclude 'lib/db/reclassify.test.ts' --exclude 'lib/db/product-type-assignment.test.ts' --exclude 'lib/db/product-subtypes.test.ts' --exclude 'lib/db/brand-categories.test.ts' --exclude 'lib/db/purchase-deletion.test.ts' --exclude 'lib/db/pantry-type-backfill.test.ts' --exclude 'lib/db/receipt-line-type.test.ts' --exclude 'lib/db/type-suggestions.test.ts' --exclude 'lib/db/deal-announcements.test.ts' --exclude 'lib/db/restock.test.ts' --exclude 'lib/receipt-ocr-rate-limit.test.ts' --exclude 'lib/db/rate-limit.test.ts' --exclude 'lib/db/schema-integrity.test.ts' --exclude 'lib/db/account-deletion.test.ts' --exclude 'lib/db/data-reset.test.ts' --exclude 'lib/db/retention.test.ts' --exclude 'lib/db/audit.test.ts' --exclude 'lib/ingestion/teta-import.test.ts' --exclude 'lib/ingestion/dm-gtin.test.ts'

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        env:
          NEON_AUTH_BASE_URL: https://ci.invalid/neon-auth
          NEON_AUTH_COOKIE_SECRET: ci-only-build-secret-32-characters-min
        run: pnpm build

  cloudflare:
    name: Cloudflare Worker build (not deployed)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenNext build
        env:
          NEON_AUTH_BASE_URL: https://ci.invalid/neon-auth
          NEON_AUTH_COOKIE_SECRET: ci-only-build-secret-32-characters-min
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci
        run: pnpm cf:build

      - name: Worker size within the Workers Paid limit
        run: |
          pnpm exec wrangler deploy --dry-run --env "" --outdir .wrangler-dry-run | tee dry-run.log
          gzip_kib=$(grep -oE 'gzip: [0-9.]+ KiB' dry-run.log | grep -oE '[0-9.]+')
          test -n "$gzip_kib" || { echo "Could not read the Worker size from wrangler's output"; exit 1; }
          echo "Worker gzip size: ${gzip_kib} KiB"
          awk -v size="$gzip_kib" 'BEGIN { exit !(size < 9216) }' || { echo "Worker is ${gzip_kib} KiB gzip — over 9 MiB"; exit 1; }

  e2e:
    name: Playwright smoke tests
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_buddy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopping_buddy_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      TEST_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      DATABASE_DRIVER: pg
      NEXT_PUBLIC_LOCAL_DATABASE: '1'
      NEON_AUTH_COOKIE_SECRET: ci-e2e-smoke-secret-32-characters-min
      BETTER_AUTH_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the isolated E2E database
        run: pnpm exec tsx lib/db/migrate.ts --test

      - name: Seed the isolated E2E database
        run: pnpm exec tsx lib/db/seed.ts

      - name: Build production app for E2E
        env:
          NEON_AUTH_BASE_URL: https://ci.invalid/neon-auth
        run: pnpm build

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright browser
        run: timeout --signal=TERM --kill-after=15s 180s pnpm exec playwright install chromium

      - name: Run Playwright smoke tests
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEBUG: pw:webserver,pw:api
        run: timeout --signal=TERM --kill-after=15s 900s ./node_modules/.bin/playwright test

      - name: Upload Playwright diagnostics and Mobile UI v2 screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-mobile-ui-v2-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create isolated Android visual account
        env:
          MOBILE_VISUAL_EMAIL: mobile-visual@example.com
          MOBILE_VISUAL_PASSWORD: MobileVisual-2026!
        run: pnpm exec tsx e2e/mobile/create-visual-fixture.ts

      - name: Build Android debug APK for the emulator
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
          NEXT_PUBLIC_LOCAL_DATABASE: '1'
          ANITKA_E2E_CLEAR_TEXT: '1'
        run: pnpm --filter @shopping-buddy/mobile exec expo prebuild --platform android --no-install

      - name: Assemble Android debug APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
          NEXT_PUBLIC_LOCAL_DATABASE: '1'
          ANITKA_E2E_CLEAR_TEXT: '1'
        run: ./gradlew assembleDebug --no-daemon

      - name: Start the isolated PWA/API server for the Android emulator
        run: |
          nohup ./node_modules/.bin/next start > /tmp/shopping-buddy-visual-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/intro > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/shopping-buddy-visual-server.log
          exit 1

      - name: Install Maestro CLI
        env:
          MAESTRO_VERSION: 2.9.0
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prepare Android SDK for emulator runner
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "Android SDK root is unavailable" >&2
            exit 1
          fi
          # The pinned emulator action creates this directory with mkdir (not mkdir -p).
          # Ubuntu runner images already provide it, so clear it after APK assembly.
          rm -rf "$sdk_root/cmdline-tools"

      - name: Capture and compare PWA and native Android screens
        uses: ReactiveCircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm size 390x892
            adb shell wm density 160
            maestro test --test-output-dir test-results/mobile-parity/native/login --debug-output test-results/mobile-parity/debug/login .maestro/flows/mobile-visual-login.yaml -e MOBILE_VISUAL_EMAIL=mobile-visual@example.com -e MOBILE_VISUAL_PASSWORD=MobileVisual-2026!
            maestro test --test-output-dir test-results/mobile-parity/native/light --debug-output test-results/mobile-parity/debug/light .maestro/flows/mobile-visual-capture.yaml -e THEME=light
            maestro test --test-output-dir test-results/mobile-parity/native/dark --debug-output test-results/mobile-parity/debug/dark .maestro/flows/mobile-visual-capture.yaml -e THEME=dark
            ./node_modules/.bin/tsx e2e/mobile/compare-parity-screenshots.ts

      - name: Upload paired PWA and native Android screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-visual-parity-${{ github.run_id }}
          path: test-results/mobile-parity/
          if-no-files-found: warn
          retention-days: 14

  database:
    name: Database-backed tests (local PostgreSQL)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_buddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopping_buddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      TEST_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      DATABASE_DRIVER: pg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the local test database
        run: pnpm exec tsx lib/db/migrate.ts --test

      - name: Seed the local test database
        run: pnpm exec tsx lib/db/seed.ts

      - name: Database-backed tests
        run: pnpm exec vitest run --no-file-parallelism app/actions app/api lib/db/queries.test.ts lib/db/receipt-list.test.ts lib/db/store-branch-search.test.ts lib/db/deals.test.ts lib/db/purchase-items.test.ts lib/db/category-changes.test.ts lib/db/subcategory-changes.test.ts lib/db/product-classification-sync.test.ts lib/db/product-packages.test.ts lib/db/new-subcategories.test.ts lib/db/recategorize.test.ts lib/db/reclassify.test.ts lib/db/product-type-assignment.test.ts lib/db/product-subtypes.test.ts lib/db/pantry-type-backfill.test.ts lib/db/receipt-line-type.test.ts lib/db/type-suggestions.test.ts lib/db/purchase-deletion.test.ts lib/db/deal-announcements.test.ts lib/db/restock.test.ts lib/receipt-ocr-rate-limit.test.ts lib/db/rate-limit.test.ts lib/db/schema-integrity.test.ts lib/db/account-deletion.test.ts lib/db/data-reset.test.ts lib/db/retention.test.ts lib/db/audit.test.ts lib/ingestion/teta-import.test.ts lib/ingestion/dm-gtin.test.ts
