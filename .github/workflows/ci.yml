name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests, typecheck and production build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm exec vitest run --exclude 'app/actions/**/*.test.ts' --exclude 'app/api/**/*.test.ts' --exclude 'lib/db/queries.test.ts' --exclude 'lib/db/receipt-list.test.ts' --exclude 'lib/db/store-branch-search.test.ts' --exclude 'lib/db/deals.test.ts' --exclude 'lib/db/purchase-items.test.ts' --exclude 'lib/db/category-changes.test.ts' --exclude 'lib/db/subcategory-changes.test.ts' --exclude 'lib/db/product-classification-sync.test.ts' --exclude 'lib/db/product-packages.test.ts' --exclude 'lib/db/new-subcategories.test.ts' --exclude 'lib/db/recategorize.test.ts' --exclude 'lib/db/reclassify.test.ts' --exclude 'lib/db/product-type-assignment.test.ts' --exclude 'lib/db/brand-categories.test.ts' --exclude 'lib/db/purchase-deletion.test.ts' --exclude 'lib/db/deal-announcements.test.ts' --exclude 'lib/receipt-ocr-rate-limit.test.ts'

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Production build
        env:
          NEON_AUTH_BASE_URL: https://ci.invalid/neon-auth
          NEON_AUTH_COOKIE_SECRET: ci-only-build-secret-32-characters-min
        run: pnpm build

  cloudflare:
    name: Cloudflare Worker build (not deployed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: OpenNext build
        env:
          NEON_AUTH_BASE_URL: https://ci.invalid/neon-auth
          NEON_AUTH_COOKIE_SECRET: ci-only-build-secret-32-characters-min
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci
        run: pnpm cf:build

      - name: Worker size within the Workers Paid limit
        run: |
          pnpm exec wrangler deploy --dry-run --env "" --outdir .wrangler-dry-run | tee dry-run.log
          gzip_kib=$(grep -oE 'gzip: [0-9.]+ KiB' dry-run.log | grep -oE '[0-9.]+')
          test -n "$gzip_kib" || { echo "Could not read the Worker size from wrangler's output"; exit 1; }
          echo "Worker gzip size: ${gzip_kib} KiB"
          awk -v size="$gzip_kib" 'BEGIN { exit !(size < 9216) }' || { echo "Worker is ${gzip_kib} KiB gzip — over 9 MiB"; exit 1; }

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_buddy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopping_buddy_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      TEST_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_e2e
      DATABASE_DRIVER: pg
      NEXT_PUBLIC_LOCAL_DATABASE: '1'
      NEON_AUTH_COOKIE_SECRET: ci-e2e-smoke-secret-32-characters-min
      BETTER_AUTH_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the isolated E2E database
        run: pnpm exec tsx lib/db/migrate.ts --test

      - name: Seed the isolated E2E database
        run: pnpm exec tsx lib/db/seed.ts

      - name: Build production app for E2E
        env:
          NEON_AUTH_BASE_URL: https://ci.invalid/neon-auth
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEBUG: pw:webserver,pw:api
        run: timeout --signal=TERM --kill-after=15s 180s ./node_modules/.bin/playwright test

      - name: Upload Playwright diagnostics and Mobile UI v2 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-ui-v2-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: Database-backed tests (local PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_buddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopping_buddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      TEST_DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/shopping_buddy_test
      DATABASE_DRIVER: pg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate the local test database
        run: pnpm exec tsx lib/db/migrate.ts --test

      - name: Seed the local test database
        run: pnpm exec tsx lib/db/seed.ts

      - name: Database-backed tests
        run: pnpm exec vitest run --no-file-parallelism app/actions app/api lib/db/queries.test.ts lib/db/receipt-list.test.ts lib/db/store-branch-search.test.ts lib/db/deals.test.ts lib/db/purchase-items.test.ts lib/db/category-changes.test.ts lib/db/subcategory-changes.test.ts lib/db/product-classification-sync.test.ts lib/db/product-packages.test.ts lib/db/new-subcategories.test.ts lib/db/recategorize.test.ts lib/db/reclassify.test.ts lib/db/product-type-assignment.test.ts lib/db/deal-announcements.test.ts lib/receipt-ocr-rate-limit.test.ts
