name: Albert flyer import

# Albert's CDN (Akamai) answers HTTP 403 to every request from Cloudflare Workers' egress range —
# the whole host, `www.albert.cz` and the flyer viewer `letaky.albert.cz` alike, and the listing
# page as well as `robots.txt` (checked 2026-10-21 with a throwaway worker). GitHub Actions runners
# are not in that range, so Albert's flyers are imported from here rather than from the Worker's
# cron. The Worker keeps the other retailers, whose crons work.
#
# The import writes the same rows the Worker's cron would write: pages read by the model into
# `flyer_pages`, and the validated offers into `deals`.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Maximum new pages to read per flyer format (blank = all)"
        required: false
        type: string
  schedule:
    # Twice a week is enough: Albert's weekly flyer changes on Wednesdays, and the pages are read
    # once and cached, so a daily run would mostly find nothing new.
    - cron: "20 5 * * WED"
    - cron: "20 5 * * FRI"

permissions:
  contents: read

concurrency:
  group: albert-flyer-import
  cancel-in-progress: false

jobs:
  import:
    name: Import Albert flyers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_PROD_DATABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_GATEWAY_ID: ${{ secrets.CLOUDFLARE_AI_GATEWAY_ID }}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_AI_GATEWAY_ID" ] || [ -z "$CLOUDFLARE_AI_GATEWAY_TOKEN" ]; then
            echo "::error::NEON_PROD_DATABASE_URL, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_AI_GATEWAY_ID and CLOUDFLARE_AI_GATEWAY_TOKEN are required"
            exit 1
          fi
          if [ -n "${{ inputs.pages }}" ] && ! [[ "${{ inputs.pages }}" =~ ^[0-9]+$ ]]; then
            echo "::error::pages must be a whole number"
            exit 1
          fi

      - name: Import Albert flyers
        run: |
          set -euo pipefail
          args=""
          if [ -n "${{ inputs.pages }}" ]; then
            args="--pages ${{ inputs.pages }}"
          fi
          # The pages are read once and cached in `flyer_pages`; a run only sends the pages it has
          # not read yet, so this is cheap until the next flyer appears.
          pnpm exec tsx scripts/albert-flyers.ts --apply $args
