name: Manual inventory multipack backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run only or apply the selected safe candidates"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      scope:
        description: "safe = only exact purchase-history matches; all = also ambiguous/no-history rows"
        required: true
        default: safe
        type: choice
        options:
          - safe
          - all
      before:
        description: "Optional safety cutoff; leave empty to evaluate all existing pantry rows"
        required: false
        default: ""
        type: string
      confirm:
        description: "Required for apply: APPLY_SAFE, or BACKFILL_ALL when scope=all"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  backfill:
    name: Inventory multipack backfill
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate apply confirmation
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.scope }}" = "safe" ] && [ "${{ inputs.confirm }}" != "APPLY_SAFE" ]; then
            echo "Apply in safe mode requires confirm=APPLY_SAFE."
            exit 1
          fi
          if [ "${{ inputs.scope }}" = "all" ] && [ "${{ inputs.confirm }}" != "BACKFILL_ALL" ]; then
            echo "Apply in all mode requires confirm=BACKFILL_ALL."
            exit 1
          fi

      - name: Run inventory multipack backfill
        run: |
          set -euo pipefail
          args=(--scope="${{ inputs.scope }}")
          if [ -n "${{ inputs.before }}" ]; then
            args+=(--before="${{ inputs.before }}")
          fi
          if [ "${{ inputs.mode }}" = "apply" ]; then
            args+=(--apply)
          fi
          pnpm exec tsx scripts/backfill-inventory-multipacks.ts "${args[@]}" | tee backfill-inventory-multipacks.jsonl

      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-multipack-backfill-report
          path: backfill-inventory-multipacks.jsonl
          if-no-files-found: ignore
          retention-days: 14
