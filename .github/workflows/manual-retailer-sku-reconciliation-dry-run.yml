name: Manual retailer SKU reconciliation dry-run

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Optional retailer source (billa, penny, lidl, dm, globus, rohlik, kosik)"
        required: false
        default: ""
        type: string
      limit:
        description: "Maximum products fetched per retailer"
        required: true
        default: "50000"
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    name: Retailer SKU reconciliation dry-run
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run retailer SKU reconciliation dry-run
        run: |
          set -euo pipefail
          args=(--limit="${{ inputs.limit }}")
          if [ -n "${{ inputs.source }}" ]; then
            args+=(--source="${{ inputs.source }}")
          fi
          pnpm db:reconcile-retailer-skus -- "${args[@]}"
