name: Manual catalog seed dry-run

on:
  workflow_dispatch:
    inputs:
      include_review:
        description: "Include seed rows marked needs_review"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dry-run:
    name: Seed catalog dry-run
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run seed catalog dry-run
        run: |
          set -euo pipefail
          if [ "${{ inputs.include_review }}" = "true" ]; then
            pnpm exec tsx scripts/import-seed-catalog.ts --include-review
          else
            pnpm exec tsx scripts/import-seed-catalog.ts --apply
          fi
