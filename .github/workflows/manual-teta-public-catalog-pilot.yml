name: Manual Teta public catalog pilot

on:
  workflow_dispatch:
    inputs:
      confirm_public_collection:
        description: "Confirm that you reviewed Teta's current robots.txt and terms and that this limited public-HTML collection is permitted."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pilot:
    name: Teta public HTML research pilot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require explicit source-permission confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_public_collection }}
        run: |
          set -euo pipefail
          if [ "${CONFIRMED}" != "true" ]; then
            echo "::error::Pilot not started. Review Teta's current robots.txt and terms, then explicitly confirm permission in workflow_dispatch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bounded public-HTML pilot
        run: |
          set -euo pipefail
          pnpm teta:fetch-public --pages=2 --products=40 --delay-ms=1500 --out=data/external/teta-github-pilot.json

      - name: Build summary report
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const input = 'data/external/teta-github-pilot.json'
          const output = 'teta-github-pilot-report.md'
          if (!fs.existsSync(input)) {
            fs.writeFileSync(output, '# Teta public catalog pilot\n\nCollector did not produce a dataset. Review the preceding workflow logs.\n')
            process.exit(0)
          }
          const data = JSON.parse(fs.readFileSync(input, 'utf8'))
          const products = Array.isArray(data.products) ? data.products : []
          const count = predicate => products.filter(predicate).length
          const candidateCount = products.reduce((n, p) => n + (Array.isArray(p.priceCandidates) ? p.priceCandidates.length : 0), 0)
          const unclassified = products.reduce((n, p) => n + (p.priceCandidates ?? []).filter(c => c.role === 'unclassified').length, 0)
          const warnings = products.reduce((n, p) => n + (p.extractionWarnings?.length ?? 0), 0)
          const lines = [
            '# Teta public catalog pilot',
            '',
            '- **Collection time (UTC):** ' + (data.collectedAt ?? 'unknown'),
            '- **Source:** ' + (data.source ?? 'unknown'),
            '- **Mode:** ' + (data.mode ?? 'unknown'),
            '- **Unique catalog links found:** ' + (data.uniqueCatalogLinksFound ?? 'unknown'),
            '- **Product detail pages requested:** ' + (data.productDetailsRequested ?? products.length),
            '- **Products with name:** ' + count(p => Boolean(p.name)),
            '- **Products with source code:** ' + count(p => Boolean(p.sourceCode)),
            '- **Products with EAN/GTIN:** ' + count(p => Boolean(p.ean)),
            '- **Products with price candidates:** ' + count(p => (p.priceCandidates?.length ?? 0) > 0),
            '- **Price candidates total:** ' + candidateCount,
            '- **Unclassified price candidates:** ' + unclassified,
            '- **Products missing EAN:** ' + count(p => (p.missingFields ?? []).includes('ean')),
            '- **Extraction warnings total:** ' + warnings,
            '',
            '> Research only. This report does not establish permission for automated collection, prove prices apply to physical stores, or authorize production import.',
            ''
          ]
          fs.writeFileSync(output, lines.join('\n'))
          NODE

      - name: Upload research dataset and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teta-public-catalog-pilot
          path: |
            data/external/teta-github-pilot.json
            teta-github-pilot-report.md
          if-no-files-found: ignore
          retention-days: 14
