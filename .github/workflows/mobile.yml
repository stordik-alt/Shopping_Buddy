name: Mobile CI

# Checks for the React Native + Expo app (apps/mobile). Independent of ci.yml (the PWA): a failure here
# does not touch the web checks, and nothing here deploys, publishes or uses secrets. The PWA's production
# deploy is the manual cloudflare-deploy.yml, which never depends on this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Expo typecheck and Android export (not published)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @shopping-buddy/mobile typecheck

      # Validates that the installed packages match the Expo SDK (read-only check, changes nothing).
      - name: Expo dependency compatibility
        env:
          CI: '1'
        run: pnpm --filter @shopping-buddy/mobile exec expo install --check

      # Public configuration only; no secrets are needed or used.
      - name: Android bundle export
        env:
          EXPO_PUBLIC_API_URL: https://ci.invalid
        run: pnpm --filter @shopping-buddy/mobile export
