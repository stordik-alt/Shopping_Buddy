name: PKD approved mapping backfill

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply approved PKD mappings to currently unmapped PKD entries"
        required: true
        default: false
        type: boolean

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PKD backfill
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            pnpm exec tsx scripts/backfill-pkd-mappings.ts --apply
          else
            pnpm exec tsx scripts/backfill-pkd-mappings.ts
          fi
