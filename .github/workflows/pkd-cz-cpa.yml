name: PKD CZ-CPA import

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "CZSO CZ-CPA page or direct XML/CSV/JSON download URL"
        required: true
        default: "https://apl2.czso.cz/iSMS/klasdata.jsp?kodcis=80144"
        type: string
      language:
        description: "Classification language"
        required: true
        default: "cs"
        type: string
      version:
        description: "Classification version"
        required: true
        default: "2025"
        type: string
      apply:
        description: "Write the classification to PKD"
        required: true
        default: false
        type: boolean

jobs:
  cz-cpa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download CZ-CPA source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/cz-cpa/levels

          MIME_TYPE="$(curl -fsSL --retry 3 --retry-all-errors -A "Mozilla/5.0" -o .tmp/cz-cpa/source "$SOURCE_URL" -w '%{content_type}')"
          echo "Initial content type: $MIME_TYPE"

          if [[ "$SOURCE_URL" == *"kodcis=80144"* ]]; then
            echo "Resolving official CZ-CPA 2025 level code lists 6501-6506."
            for level in 1 2 3 4 5 6; do
              code_list="650$level"
              curl -fsSL --retry 3 --retry-all-errors \
                -A "Mozilla/5.0" \
                -H "Accept: text/csv,text/plain;q=0.9,*/*;q=0.7" \
                "https://apl2.czso.cz/iSMS/cisexp.jsp?kodcis=$code_list&typdat=0&cisjaz=203&format=2&separator=%2C" \
                -o ".tmp/cz-cpa/levels/$code_list.csv"
              test -s ".tmp/cz-cpa/levels/$code_list.csv"
              echo "Downloaded $code_list: $(file -b --mime-type ".tmp/cz-cpa/levels/$code_list.csv")"
            done

            pnpm exec tsx scripts/build-cz-cpa-csv.ts \
              --input-dir=.tmp/cz-cpa/levels \
              --output=.tmp/cz-cpa/input.csv
            test -s .tmp/cz-cpa/input.csv
            echo ".tmp/cz-cpa/input.csv" > .tmp/cz-cpa/input.path
          else
            case "$MIME_TYPE" in
              text/csv|text/plain)
                cp .tmp/cz-cpa/source .tmp/cz-cpa/input.csv
                echo ".tmp/cz-cpa/input.csv" > .tmp/cz-cpa/input.path
                ;;
              application/xml|text/xml)
                cp .tmp/cz-cpa/source .tmp/cz-cpa/input.xml
                echo ".tmp/cz-cpa/input.xml" > .tmp/cz-cpa/input.path
                ;;
              application/json|application/octet-stream)
                cp .tmp/cz-cpa/source .tmp/cz-cpa/input.json
                echo ".tmp/cz-cpa/input.json" > .tmp/cz-cpa/input.path
                ;;
              *)
                echo "Unsupported direct CZ-CPA source type: $MIME_TYPE"
                exit 1
                ;;
            esac
          fi
      - name: Run CZ-CPA import
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
          CZ_CPA_VERSION: ${{ inputs.version }}
          CZ_CPA_LANGUAGE: ${{ inputs.language }}
          CZ_CPA_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            pnpm exec tsx scripts/import-cz-cpa.ts --file="$(cat .tmp/cz-cpa/input.path)" --apply
          else
            pnpm exec tsx scripts/import-cz-cpa.ts --file=.tmp/cz-cpa/input
          fi
