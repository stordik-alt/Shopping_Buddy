name: PKD candidate generation

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write Product Type candidates to PKD"
        required: true
        default: false
        type: boolean
      list:
        description: "List persisted candidates with IDs for review/approval"
        required: true
        default: false
        type: boolean

jobs:
  candidates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PKD candidate generation
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
        run: |
          if [ "${{ inputs.list }}" = "true" ]; then
            pnpm exec tsx scripts/generate-pkd-candidates.ts --list
          elif [ "${{ inputs.apply }}" = "true" ]; then
            pnpm exec tsx scripts/generate-pkd-candidates.ts --apply
          else
            pnpm exec tsx scripts/generate-pkd-candidates.ts
          fi
