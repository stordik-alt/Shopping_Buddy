name: PKD candidate generation

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write Product Type candidates to PKD"
        required: true
        default: false
        type: boolean

jobs:
  candidates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PKD candidate generation
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            pnpm exec tsx scripts/generate-pkd-candidates.ts --apply
          else
            pnpm exec tsx scripts/generate-pkd-candidates.ts
          fi
