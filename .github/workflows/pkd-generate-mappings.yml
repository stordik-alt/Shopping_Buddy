name: PKD Product Type mapping generation

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write PKD → Product Type mapping candidates"
        required: true
        default: false
        type: boolean

jobs:
  mappings:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PKD mapping generation
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            pnpm exec tsx scripts/generate-pkd-mappings.ts --apply
          else
            pnpm exec tsx scripts/generate-pkd-mappings.ts
          fi
