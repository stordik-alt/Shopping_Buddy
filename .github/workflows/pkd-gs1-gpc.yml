name: PKD GS1 GPC import

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Optional direct URL to the GS1 GPC XML/JSON/ZIP download. Leave empty to discover it from the official GS1 2026-05 page."
        required: false
        default: ""
        type: string
      apply:
        description: "Write the imported GPC taxonomy to PKD"
        required: true
        default: false
        type: boolean

jobs:
  gpc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download GS1 GPC source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/gpc

          if [ -n "$SOURCE_URL" ]; then
            echo "Using supplied GS1 GPC source URL."
            curl -fL --retry 3 --retry-all-errors "$SOURCE_URL" -o .tmp/gpc/source
          else
            echo "Downloading the official GS1 GPC 2026-05 publication."
            curl -fL --retry 3 --retry-all-errors               "https://ref.gs1.org/standards/gpc/2026-05/"               -o .tmp/gpc/source
          fi

          file .tmp/gpc/source

          case "$(file -b --mime-type .tmp/gpc/source)" in
            application/zip|application/x-zip-compressed)
              mkdir -p .tmp/gpc/unpacked
              unzip -q .tmp/gpc/source -d .tmp/gpc/unpacked
              mapfile -t candidates < <(find .tmp/gpc/unpacked -type f \( -iname '*.xml' -o -iname '*.json' \))
              [ "${#candidates[@]}" -gt 0 ] || {
                echo "No XML/JSON GPC file found in downloaded archive."
                find .tmp/gpc/unpacked -maxdepth 3 -type f | head -n 50
                exit 1
              }

              candidate="$(python - "${candidates[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          best = None
          best_count = -1
          for raw_path in sys.argv[1:]:
              path = Path(raw_path)
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              count = len(set(re.findall(r"(?<!\d)\d{8}(?!\d)", text)))
              print(f"GPC candidate: {path} -> {count} unique 8-digit codes", file=sys.stderr)
              if count > best_count:
                  best = path
                  best_count = count

          if best is None or best_count <= 0:
              raise SystemExit("No candidate XML/JSON file contains an 8-digit GPC code.")
          print(best)
          PY
              )"

              echo "Selected GPC taxonomy file: $candidate"
              cp "$candidate" .tmp/gpc/input
              ;;
            application/xml|text/xml|application/json|text/plain)
              cp .tmp/gpc/source .tmp/gpc/input
              ;;
            *)
              echo "Unsupported downloaded file type: $(file -b --mime-type .tmp/gpc/source)"
              exit 1
              ;;
          esac

      - name: Run GS1 GPC import
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
          GPC_VERSION: 2026-05
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            pnpm exec tsx scripts/import-gs1-gpc.ts --file=.tmp/gpc/input --apply
          else
            pnpm exec tsx scripts/import-gs1-gpc.ts --file=.tmp/gpc/input
          fi
