name: PKD normalization and deduplication

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write normalization records and dedup candidates"
        required: true
        default: false
        type: boolean

jobs:
  normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run PKD normalization
        env:
          DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            pnpm exec tsx scripts/normalize-pkd.ts --apply
          else
            pnpm exec tsx scripts/normalize-pkd.ts
          fi
