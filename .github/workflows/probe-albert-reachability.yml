name: Probe Albert reachability

# Temporary probe: does a GitHub Actions runner reach Albert's listing page? The Worker's cron
# gets HTTP 403 from Albert's CDN, and the Albert import will run from here instead, so this has
# to be true before the import workflow is relied on. Read-only: it fetches one public page.

on:
  push:
    branches: [feature/albert-flyer-import-from-github-actions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Albert's flyer listing
        run: |
          set -euo pipefail
          for url in "https://www.albert.cz/aktualni-letaky" "https://letaky.albert.cz/43sm_akcni_letak/spreads.json"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 25 \
              -A "ShoppingBuddy-connector/0.1 (+https://github.com/stordik-alt/Shopping_Buddy)" "$url" || echo "curl-failed")
            echo "$code  $url"
            echo "$code  $url" >> "$GITHUB_STEP_SUMMARY"
          done
