name: Product Subtype Expansion Simulation

on:
  workflow_dispatch:
    inputs:
      include_details:
        description: Include every product from the six target Product Types in the output
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only Product Subtype expansion simulation
        run: |
          if [ "${{ inputs.include_details }}" = "true" ]; then
            pnpm db:simulate-product-subtype-expansion --details
          else
            pnpm db:simulate-product-subtype-expansion
          fi
