name: Product Subtype Expansion Simulation

on:
  workflow_dispatch:
    inputs:
      include_details:
        description: Include every product from the six target Product Types in the output
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only Product Subtype expansion simulation
        run: |
          if [ "${{ inputs.include_details }}" = "true" ]; then
            pnpm exec tsx scripts/simulate-product-subtype-expansion.ts --details
          else
            pnpm exec tsx scripts/simulate-product-subtype-expansion.ts
          fi
