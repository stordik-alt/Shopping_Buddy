name: Product Subtype Expansion Simulation

on:
  workflow_dispatch:
    inputs:
      include_details:
        description: Include every product from the six target Product Types in the output
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run read-only Product Subtype expansion simulation
        run: |
          if [ "${{ inputs.include_details }}" = "true" ]; then
            pnpm exec tsx scripts/simulate-product-subtype-expansion.ts --details
          else
            pnpm exec tsx scripts/simulate-product-subtype-expansion.ts
          fi
