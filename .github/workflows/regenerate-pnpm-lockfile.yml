name: Regenerate pnpm lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    if: github.head_ref == 'chore/regenerate-pnpm-lockfile-20261008'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/regenerate-pnpm-lockfile-20261008
          fetch-depth: 0

      - name: Setup pnpm 12.6.0
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile with pnpm
        run: pnpm install --lockfile-only

      - name: Verify frozen lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already consistent with pnpm 12.6.0."
          else
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate pnpm lockfile"
            git push origin HEAD:chore/regenerate-pnpm-lockfile-20261008
          fi

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/regenerate-pnpm-lockfile.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || (git commit -m "chore: remove temporary lockfile workflow" && git push origin HEAD:chore/regenerate-pnpm-lockfile-20261008)
