name: Seed catalog apply (one-shot)

on:
  push:
    branches:
      - main
    paths:
      - .github/seed-catalog-apply-trigger.txt

permissions:
  contents: read

jobs:
  apply:
    name: Apply seed catalog to production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_PROD_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply seed catalog
        if: github.event.head_commit.message == 'ops: trigger production seed catalog apply'
        run: pnpm exec tsx scripts/import-seed-catalog.ts --apply

      - name: Verify trigger message
        if: github.event.head_commit.message != 'ops: trigger production seed catalog apply'
        run: echo "Trigger file changed without the one-shot apply commit message; no production write performed."
