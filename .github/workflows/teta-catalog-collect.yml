name: Collect Teta catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to collect: the category listings, the product pages, or both"
        type: choice
        options:
          - list
          - detail
          - both
        default: both
      list_limit:
        description: "Maximum listing pages this run reads (0 = all that are left). 40 products per page."
        type: string
        default: "0"
      detail_limit:
        description: "Maximum product pages this run reads (0 = all that are left)."
        type: string
        default: "0"
      resume_run_id:
        description: "The id of an earlier run of this workflow: its files are downloaded so this run continues where it stopped (empty = fresh start)."
        type: string
        required: false
      confirm_public_collection:
        description: "Confirm that you reviewed Teta's current robots.txt and terms and that this limited public-HTML collection is permitted."
        required: true
        type: boolean
        default: false

# The run only reads Teta's public pages and writes files into this repository's artifacts — it
# writes nothing to the database. The import is a separate, explicit step (pnpm db:import-teta).
permissions:
  contents: read
  actions: read

jobs:
  collect:
    name: Teta public catalog collection
    runs-on: ubuntu-latest
    # The product pages are read one per second, so a full catalog takes hours. The run is
    # resumable, so a run that hits the limit is continued by the next one.
    timeout-minutes: 360
    steps:
      - name: Require explicit source-permission confirmation
        env:
          CONFIRMED: ${{ inputs.confirm_public_collection }}
        run: |
          set -euo pipefail
          if [ "${CONFIRMED}" != "true" ]; then
            echo "::error::Collection not started. Review Teta's current robots.txt and terms, then explicitly confirm permission in workflow_dispatch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the files of an earlier run
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teta-catalog
          path: data/external
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Collect the category listings
        run: |
          set -euo pipefail
          if [ -f data/external/teta-catalog-listing.ndjson ]; then
            echo "The listing file is already there — the listings are not read again."
          else
            args=()
            if [ "${{ inputs.list_limit }}" != "0" ]; then args+=("--limit=${{ inputs.list_limit }}"); fi
            pnpm teta:collect -- --mode=list "${args[@]}"
          fi

      - name: Collect the product pages
        if: inputs.mode == 'detail' || inputs.mode == 'both'
        run: |
          set -euo pipefail
          if [ ! -f data/external/teta-catalog-listing.ndjson ]; then
            echo "::error::No listing file: the product pages are read for the products the listings found. Run the list mode first."
            exit 1
          fi
          args=()
          if [ "${{ inputs.detail_limit }}" != "0" ]; then args+=("--limit=${{ inputs.detail_limit }}"); fi
          pnpm teta:collect -- --mode=detail "${args[@]}"

      - name: Build the summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const count = (path) => {
            if (!fs.existsSync(path)) return 0
            return fs.readFileSync(path, 'utf8').split('\n').filter((line) => line.trim()).length
          }
          const statePath = 'data/external/teta-collect-state.json'
          const state = fs.existsSync(statePath) ? JSON.parse(fs.readFileSync(statePath, 'utf8')) : null
          const details = state ? Object.values(state.details ?? {}) : []
          const lines = [
            '# Teta catalog collection',
            '',
            '- **Listing records:** ' + count('data/external/teta-catalog-listing.ndjson'),
            '- **Product page records:** ' + count('data/external/teta-catalog-detail.ndjson'),
            '- **Product pages done:** ' + details.filter((value) => value === 'done').length,
            '- **Product pages failed:** ' + details.filter((value) => value === 'failed').length,
            '',
            '> The records are collected from Teta\'s public pages. Nothing was written to the database.',
            '',
          ]
          fs.writeFileSync('teta-catalog-report.md', lines.join('\n'))
          NODE

      - name: Upload the collected catalog
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teta-catalog
          path: |
            data/external/teta-catalog-listing.ndjson
            data/external/teta-catalog-detail.ndjson
            data/external/teta-collect-state.json
            teta-catalog-report.md
          if-no-files-found: ignore
          retention-days: 14
