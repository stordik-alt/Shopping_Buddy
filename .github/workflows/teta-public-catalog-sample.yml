name: Teta public catalog sample

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teta-public-catalog-sample
  cancel-in-progress: false

jobs:
  collect:
    name: Collect public Teta sample
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect bounded public HTML sample
        run: pnpm teta:fetch-public -- --pages=1 --products=20 --delay-ms=1200

      - name: Upload research dataset
        if: always() && hashFiles('data/external/teta-public-catalog-sample.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teta-public-catalog-sample
          path: data/external/teta-public-catalog-sample.json
          if-no-files-found: error
          retention-days: 14
