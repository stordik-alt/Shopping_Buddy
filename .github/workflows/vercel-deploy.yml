name: Vercel production deploy

# Manual only: nothing starts this workflow automatically, and it never runs for a pull request.
# Pushes and pull requests are built and tested by ci.yml; a production deploy is a deliberate click.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production to Vercel
    # A manual run started from any other branch (e.g. a pull request's) is refused instead of deploying.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # The CLI comes from the lockfile (devDependency `vercel`, exact version), not from
      # `npx vercel@latest`, which would run whatever was published last with the production token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        run: pnpm exec vercel deploy --prod --yes --token "$VERCEL_TOKEN"
