appId: cz.shoppingbuddy.mobile
---
- launchApp
- tapOn:
    id: login-email
- inputText: ${MOBILE_AUTH_SMOKE_EMAIL}
- tapOn:
    id: login-password
- inputText: ${MOBILE_AUTH_SMOKE_PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: home-assistant-button
    timeout: 30000
