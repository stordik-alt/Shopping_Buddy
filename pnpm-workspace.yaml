pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

allowBuilds:
  # core-js is a transitive dependency (via @neondatabase/auth -> @triplit/db); its
  # postinstall script only prints a sponsorship message, nothing functional is needed.
  core-js: false
  esbuild: true
  # workerd (Cloudflare's Workers runtime, pulled in by wrangler for local preview of the Cloudflare
  # build) checks in its postinstall that the platform binary installed correctly.
  workerd: true

overrides:
  browserslist: "4.28.7"
  fast-uri: "3.1.7"
  nanoid: "3.3.18"
  source-map-js: "1.2.2"
  undici: "7.29.1"
